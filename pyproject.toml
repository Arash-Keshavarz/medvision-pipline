[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medvision-pipeline"
version = "0.1.0"
description = "An end-to-end medical image classification pipeline for skin lesion analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Arash Keshavarz" }
]
keywords = [
    "medical-imaging",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "fastapi",
    "mlops"
]

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "ipykernel>=6.29"
]

data = [
    "kaggle"
    ]

mlops = [
    "mlflow>=2.16",
    "dvc>=3.55"
]

[project.urls]
Repository = "https://github.com/Arash-Keshavarz/medvision-pipeline"
Dataset = "https://www.kaggle.com/datasets/nodoubttome/skin-cancer9-classesisic"

[tool.hatch.build.targets.wheel]
packages = ["src/medvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "-ra"
]

[tool.coverage.run]
source = ["medvision"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true